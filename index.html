      '<section class="panel"><form id="audit-filter-form" class="filter-row" style="grid-template-columns:1fr auto"><input class="field filter-search" name="search" value="' + esc(search) + '" placeholder="ابحث برقم الطلب أو الموظف أو الإجراء"><button class="button button-primary">بحث</button></form>' +
      (events.length ? '<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الإجراء</th><th>منفذ الإجراء</th><th>الطلب</th><th>الموظف</th><th>الحالة</th><th>التعليق</th></tr></thead><tbody>' +
        events.map((event) => '<tr><td>' + esc(event.date) + '<div class="row-sub">' + esc(event.time) + '</div></td><td>' + esc(AUDIT_LABELS[event.action] || event.action) +
          '</td><td>' + personName(event.userName) + '<div class="row-sub">' + esc(ROLE_LABELS[event.role] || event.role) + '</div></td><td>' +
          (event.transactionId ? '<a class="table-link" href="#/requests/' + encodeURIComponent(event.transactionId) + '" data-go="/requests/' + encodeURIComponent(event.transactionId) + '">' + esc(event.transactionId) + "</a>" : "—") +
          '</td><td>' + personName(event.employeeName) + '</td><td>' + (event.newStatus ? statusBadge(event.newStatus) : "—") +
          '</td><td>' + esc(event.comment || event.newValue || "—") + "</td></tr>").join("") + "</tbody></table></div>" :
        emptyState("لا توجد أحداث مطابقة", "جرّب عبارة بحث أخرى.")) + "</section></div>";
  } catch (error) { main.innerHTML = '<div class="page">' + pageHead("سجل التدقيق", "") + displayError(error) + "</div>"; }
}

async function authenticate(employeeCode, password) {
  const result = await rpc("apiLogin", employeeCode, password);
  state.token = result.token;
  state.user = result.user;
  sessionStorage.setItem(SESSION_KEY, state.token);
  go("/dashboard");
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(new Error("تعذر قراءة الملف المحدد."));
    reader.readAsDataURL(file);
  });
}

async function getRequestAttachment(requestId, fileId) {
  const file = await rpc("apiDownloadAttachment", state.token, requestId, fileId);
  const binary = atob(file.base64);
  const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
  return {
    fileName: file.fileName || "attachment",
    mimeType: file.mimeType || "application/octet-stream",
    blob: new Blob([bytes], { type: file.mimeType || "application/octet-stream" }),
  };
}

async function downloadFile(requestId, fileId) {
  const file = await getRequestAttachment(requestId, fileId);
  const url = URL.createObjectURL(file.blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = file.fileName;
  link.click();
  window.setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function openRequestImage(requestId, fileId) {
  const file = await getRequestAttachment(requestId, fileId);
  if (!/^image\/(jpeg|png|webp|gif)$/i.test(file.mimeType)) {
    throw new Error("المرفق ليس صورة قابلة للعرض.");
  }
  const url = URL.createObjectURL(file.blob);
  APP.insertAdjacentHTML("beforeend", renderModal(file.fileName, '<div class="request-image-preview"><img id="request-image-preview" src="' +
    esc(url) + '" alt="' + esc(file.fileName) + '"></div><div class="row-sub">' + esc(file.fileName) + '</div>'));
  const backdrop = APP.querySelector(".modal-backdrop");
  if (backdrop) {
    backdrop.id = "image-preview-modal";
    backdrop.dataset.objectUrl = url;
  } else {
    URL.revokeObjectURL(url);
  }
}

function optimizedImage(file) {
  if (!file || !/^image\/(jpeg|png|webp)$/i.test(file.type || "")) return Promise.resolve(file);
  const limitBytes = (Number(state.status && state.status.attachmentMaxMb) || 8) * 1024 * 1024;
  const optimizeAboveBytes = Math.min(1.5 * 1024 * 1024, limitBytes * 0.55);
  return new Promise((resolve) => {
    const sourceUrl = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      const maxEdge = 1440;
      const scale = Math.min(1, maxEdge / Math.max(image.naturalWidth, image.naturalHeight));
      if (scale >= 1 && file.size <= optimizeAboveBytes) {
        URL.revokeObjectURL(sourceUrl);
        resolve(file);
        return;
      }
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
      const context = canvas.getContext("2d");
      if (!context) {
        URL.revokeObjectURL(sourceUrl);
        resolve(file);
        return;
      }
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => {
        URL.revokeObjectURL(sourceUrl);
        if (!blob || (blob.size >= file.size && file.size <= limitBytes)) {
          resolve(file);
          return;
        }
        resolve(new File([blob], file.name, { type: blob.type || file.type, lastModified: file.lastModified }));
      }, file.type === "image/jpeg" ? "image/jpeg" : file.type, file.type === "image/jpeg" ? 0.84 : undefined);
    };
    image.onerror = () => {
      URL.revokeObjectURL(sourceUrl);
      resolve(file);
    };
    image.src = sourceUrl;
  });
}

async function previewAttachment(file, output) {
  if (!output) return;
  output.textContent = "";
  if (!file) return;
  if (!/^image\/(jpeg|png|webp|gif)$/i.test(file.type || "")) {
    output.textContent = file.type === "application/pdf" ? "تم تحديد ملف PDF. سيبقى التنزيل متاحًا بعد الإرسال." : "تم تحديد الملف.";
    return;
  }
  output.textContent = "جارٍ تجهيز معاينة الصورة…";
  try {
    const imageFile = await optimizedImage(file);
    const objectUrl = URL.createObjectURL(imageFile);
    output.innerHTML = '<span>معاينة جاهزة' + (imageFile.size < file.size ? " · تم تقليل حجم الصورة مع الحفاظ على الوضوح" : "") + '</span><img alt="معاينة المرفق" src="' + objectUrl + '">';
  } catch (_) {
    output.textContent = "تعذرت المعاينة، ويمكن متابعة إرفاق الصورة.";
  }
}

document.addEventListener("change", (event) => {
  const target = event.target;
  if (target.matches('#new-request-form [name="employeeCode"]')) {
    if (target.value) loadLoanEligibility(target.value);
    else {
      state.loanEligibility = null;
      const panel = document.getElementById("loan-eligibility");
      if (panel) panel.textContent = "اختر الموظف لعرض السلف المتاحة.";
    }
  }
  if (target.matches('#new-request-form [name="loanType"]')) {
    const form = document.getElementById("new-request-form");
    const eligibility = state.loanEligibility;
    const submit = form && form.querySelector('button[type="submit"]');
    if (submit) submit.disabled = !eligibility || eligibility.employeeCode !== (form.elements.employeeCode ? form.elements.employeeCode.value : state.user.employeeCode) ||
      !((eligibility.result.loans || {})[target.value] || {}).available;
  }
  if (target.matches('#new-request-form [name="attachment"]')) {
    previewAttachment(target.files && target.files[0], document.getElementById("attachment-preview"));
  }
});

document.addEventListener("click", async (event) => {
  const target = event.target.closest("[data-go], [data-action]");
  if (!target) return;
  if (target.hasAttribute("data-go")) {
    event.preventDefault();
    go(target.getAttribute("data-go"));
    const sidebar = document.getElementById("sidebar");
    if (sidebar) sidebar.classList.remove("open");
    return;
  }
  const action = target.getAttribute("data-action");
  try {
    if (action === "menu") {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("open");
      const menuButton = document.querySelector(".menu-button");
      if (menuButton) menuButton.setAttribute("aria-expanded", String(sidebar.classList.contains("open")));
    }
    if (action === "close-modal") {
      const backdrop = target.closest(".modal-backdrop");
      if (backdrop && backdrop.dataset.objectUrl) URL.revokeObjectURL(backdrop.dataset.objectUrl);
      if (backdrop) backdrop.remove();
    }
    if (action === "retry") {
      if (state.user) renderRoute();
      else boot();
    }
    if (action === "logout") {
      try { await rpc("apiLogout", state.token); } catch (_) { /* clear local session even if logging out fails */ }
      state.token = ""; state.user = null; sessionStorage.removeItem(SESSION_KEY); renderLogin();
    }
    if (action === "new-employee") employeeModal(null);
    if (action === "edit-employee") employeeModal(state.employees.find((item) => item.employeeCode === target.dataset.code));
    if (action === "new-record") recordModal(null);
    if (action === "edit-record") recordModal(state.departmentRecords.find((item) => item.recordId === target.dataset.id));
    if (action === "penalty-step") {
      const input = target.closest(".penalty-control").querySelector('[name="amount"]');
      const current = Number(input.value) || 0;
      const next = Math.max(0.25, Math.min(365, Math.round((current + Number(target.dataset.step)) * 4) / 4));
      input.value = String(next);
      input.dispatchEvent(new Event("input", { bubbles: true }));
    }
    if (action === "retry-eligibility") {
      const form = document.getElementById("new-request-form");
      const employeeSelect = form.elements.employeeCode;
      loadLoanEligibility(employeeSelect ? employeeSelect.value : state.user.employeeCode);
    }
    if (action === "download") {
      target.disabled = true;
      await downloadFile(target.dataset.requestId, target.dataset.fileId);
      target.disabled = false;
    }
    if (action === "preview-attachment") {
      target.disabled = true;
      await openRequestImage(target.dataset.requestId, target.dataset.fileId);
      target.disabled = false;
    }
    if (action === "decide") {
      const decision = target.dataset.decision;
      const comment = (document.getElementById("decision-comment").value || "").trim();
      if (decision === "REJECTED" && !comment) return notify("اكتب سبب الرفض قبل إرساله.");
      target.disabled = true;
      await rpc("apiDecideApproval", state.token, state.currentRequest.requestId, decision, comment);
      invalidateFinancialViewCache();
      notify(decision === "APPROVED" ? "تم اعتماد الطلب." : "تم رفض الطلب.");
      renderRoute();
    }
    if (action === "decide-loan") {
      const decision = target.dataset.decision;
      const amountInput = document.getElementById("loan-approved-amount");
      const requestedAmount = Number(state.currentRequest.loanDecision && state.currentRequest.loanDecision.requestedAmount ||
        state.currentRequest.requestedAmount || state.currentRequest.amount);
      const approvedAmount = decision === "APPROVED" ? Number(amountInput.value) : 0;
      const comment = (document.getElementById("loan-hr-comment").value || "").trim();
      if (decision === "REJECTED" && !comment) return notify("اكتب سبب رفض السلفة.");
      if (decision === "APPROVED" && (!Number.isInteger(approvedAmount) || approvedAmount <= 0 ||
          approvedAmount % 50 !== 0 || approvedAmount > requestedAmount)) {
        return notify("المبلغ المعتمد يجب أن يكون موجبًا، من مضاعفات ٥٠، ولا يتجاوز المطلوب.");
      }
      target.disabled = true;
      await rpc("apiDecideLoan", state.token, state.currentRequest.requestId, decision, approvedAmount, comment);
      invalidateFinancialViewCache();
      notify(decision === "APPROVED" ? "تم اعتماد مبلغ الصرف." : "تم رفض طلب السلفة.");
      renderRoute();
    }
    if (action === "override") {
      const comment = (document.getElementById("override-comment").value || "").trim();
      if (!comment) return notify("سبب التجاوز الإداري مطلوب.");
      target.disabled = true;
      await rpc("apiAdminOverrideRequest", state.token, state.currentRequest.requestId, comment);
      invalidateFinancialViewCache();
      notify("تم تسجيل التجاوز الإداري في سجل التدقيق.");
      renderRoute();
    }
  } catch (error) {
    notify(error.message || "تعذر إكمال العملية.");
    target.disabled = false;
  }
});

document.addEventListener("submit", async (event) => {
  const form = event.target;
  if (!(form instanceof HTMLFormElement)) return;
  const data = new FormData(form);
  event.preventDefault();
  const submitButton = form.querySelector('button[type="submit"],button:not([type])');
  if (submitButton) submitButton.disabled = true;
  try {
    if (form.id === "login-form") {
      await authenticate(String(data.get("employeeCode") || "").trim(), String(data.get("password") || ""));
    } else if (form.id === "request-filter-form") {
      state.filters = {
        kind: String(data.get("kind") || "ALL"), status: String(data.get("status") || "ALL"),
        search: String(data.get("search") || "").trim(), fromDate: String(data.get("fromDate") || ""),
        toDate: String(data.get("toDate") || ""),
        employeeCode: String(data.get("employeeCode") || "").trim(),
        employeeName: String(data.get("employeeName") || "").trim(),
        createdDate: String(data.get("createdDate") || ""),
        department: String(data.get("department") || "").trim(),
      };
      renderRoute();
    } else if (form.id === "new-request-form") {
      const path = routePath();
      const isLoan = path === "/new/loan";
      const kind = isLoan ? String(data.get("loanType") || "LOAN15") : path === "/new/deduction" ? "DEDUCTION" : "PENALTY";
      const employeeCode = String(data.get("employeeCode") || "").trim();
      const amount = Number(data.get("amount"));
      const notes = String(data.get("notes") || "").trim();
      if (isLoan) {
        if (!Number.isInteger(amount) || amount <= 0 || amount % 50 !== 0) {
          throw new Error("مبلغ السلفة يجب أن يكون موجبًا ومن مضاعفات ٥٠.");
        }
        const eligibility = state.loanEligibility;
        if (!eligibility || eligibility.employeeCode !== employeeCode ||
            !((eligibility.result.loans || {})[kind] || {}).available) {
          throw new Error("هذا النوع من السلف غير متاح لهذا الموظف حاليًا.");
        }
        await rpc("apiCreateLoan", state.token, { employeeCode, kind, amount, notes });
      } else {
        if (kind === "PENALTY" && (!Number.isFinite(amount) || amount <= 0 || Math.abs(amount * 4 - Math.round(amount * 4)) > 1e-8)) {
          throw new Error("مدة الجزاء يجب أن تكون بالأيام وبخطوات ربع يوم.");
        }
        const attachment = form.elements.attachment.files[0];
        let uploaded = null;
        if (attachment) {
          const uploadFile = await optimizedImage(attachment);
          const maxAttachmentBytes = (Number(state.status && state.status.attachmentMaxMb) || 8) * 1024 * 1024;
          if (uploadFile.size > maxAttachmentBytes) {
            throw new Error("حجم المرفق بعد تحسينه يتجاوز حد النظام (" +
              (Number(state.status && state.status.attachmentMaxMb) || 8) + " ميغابايت).");
          }
          uploaded = { fileName: uploadFile.name, mimeType: uploadFile.type || attachment.type, base64: await toBase64(uploadFile) };
        }
        await rpc("apiCreateFinancialRequest", state.token, {
          employeeCode, kind, amount, reason: String(data.get("reason") || "").trim(), notes, attachment: uploaded,
        });
      }
      invalidateFinancialViewCache();
      notify(isLoan
        ? "تم إرسال طلب السلفة لمراجعة الموارد البشرية."
        : "تم إرسال الطلب إلى أول مرحلة موافقة.");
      go("/requests");
    } else if (form.id === "employee-search-form") {
      state.employeeSearch = String(data.get("search") || "").trim();
      renderRoute();
    } else if (form.id === "employee-form") {
      const input = {
        employeeCode: String(data.get("employeeCode") || form.elements.employeeCode.value || "").trim(),
        name: String(data.get("name") || "").trim(),
        department: String(data.get("department") || "").trim(),
        approvalDepartments: String(data.get("approvalDepartments") || "").split(",").map((value) => value.trim()).filter(Boolean),
        active: form.elements.active.checked,
        password: String(data.get("password") || ""),
      };
      await rpc("apiSaveEmployee", state.token, input);
      invalidateFinancialViewCache();
      notify("تم حفظ سجل الموظف.");
      document.querySelector(".modal-backdrop").remove();
      renderRoute();
    } else if (form.id === "configuration-form") {
      const old = state.configuration;
      const input = {
        ...old,
        maxApprovalLevels: Number(data.get("maxApprovalLevels")),
        sessionMinutes: Number(data.get("sessionMinutes")),
        attachmentMaxMb: Number(data.get("attachmentMaxMb")),
      };
      state.configuration = await rpc("apiSaveConfiguration", state.token, input);
      notify("تم حفظ سياسات النظام.");
      renderRoute();
    } else if (form.id === "record-form") {
      const input = {
        recordId: form.dataset.recordId || "",
        recordType: String(data.get("recordType") || "BRANCH"),
        code: String(data.get("code") || "").trim(),
        name: String(data.get("name") || "").trim(),
        parentCode: String(data.get("parentCode") || "").trim(),
        branch: String(data.get("branch") || "").trim(),
        department: String(data.get("department") || "").trim(),
        employeeCode: String(data.get("employeeCode") || "").trim(),
        role: String(data.get("role") || ""),
        active: form.elements.active.checked,
      };
      if (form.dataset.recordId) input.recordId = form.dataset.recordId;
      await rpc("apiSaveDepartmentRecord", state.token, input);
      notify("تم حفظ سجل الهيكل التنظيمي.");
      document.querySelector(".modal-backdrop").remove();
      renderRoute();
    } else if (form.id === "audit-filter-form") {
      state.auditSearch = String(data.get("search") || "").trim();
      renderRoute();
    }
  } catch (error) {
    notify(error.message || "تعذر حفظ البيانات.");
    if (submitButton) submitButton.disabled = false;
  }
});

window.addEventListener("hashchange", renderRoute);

async function boot() {
  try {
    state.status = await rpc("apiGetAppStatus");
  } catch (error) {
    state.bootError = error.message || "تعذر الاتصال بخدمة النظام.";
    renderLogin();
    return;
  }
  if (state.token) {
    try {
      state.user = await rpc("apiGetSession", state.token);
      renderRoute();
      return;
    } catch (_) {
      state.token = ""; sessionStorage.removeItem(SESSION_KEY);
    }
  }
  renderLogin();
}

boot();
