function ctlSaveBlob(buffer, filename) {
  const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function ctlDownloadReport(report) {
  const ExcelJS = await ctlLoadExcel();
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(report.sheetName.replace(/[\\\/\?\*\[\]:]/g, " "), { views: [{ rightToLeft: true, state: "frozen", ySplit: 3 }] });
  const cols = report.headers.length;
  const thin = { style: "thin", color: { argb: "FFDDD6C7" } };
  const border = { top: thin, bottom: thin, left: thin, right: thin };
  ws.mergeCells(1, 1, 1, cols);
  const t = ws.getCell(1, 1);
  t.value = report.title; t.font = { name: "Tahoma", size: 16, bold: true, color: { argb: "FFFBEFD2" } };
  t.alignment = { horizontal: "center", vertical: "middle" }; t.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF173D48" } };
  ws.getRow(1).height = 32;
  ws.mergeCells(2, 1, 2, cols);
  const s = ws.getCell(2, 1);
  s.value = report.subtitle; s.font = { name: "Tahoma", size: 10, color: { argb: "FF3F5A5D" } };
  s.alignment = { horizontal: "center", vertical: "middle" }; s.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFF5EFE0" } };
  ws.getRow(2).height = 22;
  const head = ws.getRow(3);
  report.headers.forEach((h, i) => {
    const c = head.getCell(i + 1);
    c.value = h; c.font = { name: "Tahoma", bold: true, size: 11, color: { argb: "FFFFFFFF" } };
    c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF286B73" } };
    c.alignment = { horizontal: "center", vertical: "middle", wrapText: true }; c.border = border;
  });
  head.height = 28;
  report.rows.forEach((row, n) => {
    const r = ws.getRow(4 + n);
    row.forEach((v, i) => {
      const c = r.getCell(i + 1);
      c.value = v; c.font = { name: "Tahoma", size: 10.5 }; c.border = border;
      c.alignment = { horizontal: typeof v === "number" ? "center" : "right", vertical: "middle", wrapText: true };
      if (n % 2 === 1) c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFBF7EC" } };
      if (i === report.statusColumn) {
        const color = v === "معتمد" ? ["FFD3E8DD", "FF286B73"] : v === "مرفوض" ? ["FFF4D9D4", "FFA64A3E"] : v === "قيد الانتظار" ? ["FFF5E3BF", "FF7E5812"] : null;
        if (color) { c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: color[0] } }; c.font = { name: "Tahoma", size: 10.5, bold: true, color: { argb: color[1] } }; c.alignment = { horizontal: "center", vertical: "middle" }; }
      }
    });
  });
  if (report.totals && report.rows.length) {
    const r = ws.getRow(4 + report.rows.length);
    report.totals.forEach((v, i) => {
      const c = r.getCell(i + 1);
      c.value = v === "" ? null : v; c.font = { name: "Tahoma", bold: true, size: 11, color: { argb: "FF173D48" } };
      c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE7AD8A" } }; c.border = border; c.alignment = { horizontal: "center", vertical: "middle" };
    });
  }
  report.headers.forEach((h, i) => {
    let max = String(h).length;
    report.rows.forEach((row) => { max = Math.max(max, String(row[i] == null ? "" : row[i]).length); });
    ws.getColumn(i + 1).width = Math.min(46, Math.max(12, max + 4));
  });
  if (report.rows.length) ws.autoFilter = { from: { row: 3, column: 1 }, to: { row: 3 + report.rows.length, column: cols } };
  ws.pageSetup = { orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0 };
  ctlSaveBlob(await wb.xlsx.writeBuffer(), report.filename);
}

function ctlCellText(value) {
  if (value === null || value === undefined) return "";
  if (value instanceof Date) {
    const p = (n) => String(n).padStart(2, "0");
    return value.getUTCFullYear() + "-" + p(value.getUTCMonth() + 1) + "-" + p(value.getUTCDate()) + " " + p(value.getUTCHours()) + ":" + p(value.getUTCMinutes()) + ":" + p(value.getUTCSeconds());
  }
  if (typeof value === "object") {
    if (value.richText) return value.richText.map((x) => x.text).join("");
    if (value.result !== undefined) return ctlCellText(value.result);
    if (value.text !== undefined) return ctlCellText(value.text);
    return "";
  }
  return String(value);
}

async function ctlReadWorkbook(file) {
  const ExcelJS = await ctlLoadExcel();
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(await file.arrayBuffer());
  const ws = wb.worksheets[0];
  if (!ws) throw new Error("الملف لا يحتوي على أي شيت.");
  const headers = [];
  ws.getRow(1).eachCell({ includeEmpty: true }, (cell, col) => { headers[col - 1] = ctlCellText(cell.value).trim(); });
  const rows = [];
  const rowNumbers = [];
  ws.eachRow({ includeEmpty: false }, (row, number) => {
    if (number === 1) return;
    const cells = headers.map((h, i) => ctlCellText(row.getCell(i + 1).value));
    if (cells.every((c) => c.trim() === "")) return;
    rows.push(cells); rowNumbers.push(number);
  });
  return { headers, rows, rowNumbers };
}

document.addEventListener("click", async (event) => {
  const el = event.target.closest("[data-ctl]");
  if (!el) return;
  const action = el.dataset.ctl;
  try {
    if (action === "tab") { state.ctl.tab = el.dataset.tab; ctlRenderTab(); }
    else if (action === "gate") {
      if (!(await ctlConfirm("تأكيد", "<p>" + (el.dataset.open === "1" ? "فتح" : "إغلاق") + " التقديم على " + KIND_LABELS[el.dataset.kind] + "؟</p>", "نعم"))) return;
      await rpc("apiDashSetLoanGate", state.token, el.dataset.kind, el.dataset.open === "1");
      invalidateFinancialViewCache(); ctlRenderTab();
    }
    else if (action === "emp-new") ctlEmployeeModal(null);
    else if (action === "emp-bulk") ctlBulkEmployeeModal();
    else if (action === "bulk-apply") await ctlBulkApply(el);
    else if (action === "loans-approve") await ctlBulkLoans("APPROVED");
    else if (action === "loans-reject") await ctlBulkLoans("REJECTED");
    else if (action === "preset") {
      const r = el.dataset.p === "week" ? ctlWeekRange(0) : el.dataset.p === "lastweek" ? ctlWeekRange(1) : ["", ""];
      state.ctl.loan.fromDate = r[0]; state.ctl.loan.toDate = r[1]; ctlRenderTab();
    }
    else if (action === "mgr-new") ctlManagerModal(el.dataset.kind, null);
    else if (action === "mgr-edit") { const m = state.ctl.managers[Number(el.dataset.i)]; ctlManagerModal(m.kind, m); }
    else if (action === "mgr-del") await ctlDeleteManager(state.ctl.managers[Number(el.dataset.i)]);
    else if (action === "emp-edit") ctlEmployeeModal(state.ctl.employees[Number(el.dataset.i)]);
    else if (action === "loan-decide") ctlLoanModal(state.ctl.loans[Number(el.dataset.i)]);
    else if (action === "grid-download") { el.disabled = true; try { await ctlDownloadGrid(document.getElementById("ctl-grid-key").value); } finally { el.disabled = false; } }
    else if (action === "import-preview") { el.disabled = true; try { await ctlImportPreview(); } finally { el.disabled = false; } }
    else if (action === "import-apply") await ctlImportApply(el);
  } catch (error) { notify(error.message || "حدث خطأ."); }
}, true);

document.addEventListener("change", (event) => {
  const t = event.target;
  if (!t.dataset || !t.dataset.sel) return;
  const kind = t.dataset.sel;
  const boxes = (name) => Array.from(document.querySelectorAll('input[data-sel="' + name + '"]'));
  if (kind === "loanall" || kind === "empall") {
    const name = kind === "loanall" ? "loan" : "emp";
    const set = name === "loan" ? state.ctl.sel : state.ctl.empSel;
    boxes(name).forEach((b) => { b.checked = t.checked; if (t.checked) set.add(b.value); else set.delete(b.value); });
  } else {
    const set = kind === "loan" ? state.ctl.sel : state.ctl.empSel;
    if (t.checked) set.add(t.value); else set.delete(t.value);
  }
  ctlUpdateBars();
});

document.addEventListener("submit", async (event) => {
  const form = event.target;
  if (!form.id || form.id.indexOf("ctl-") !== 0) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  try {
    if (form.id === "ctl-emp-search") { state.ctl.empSearch = String(new FormData(form).get("search") || "").trim(); ctlRenderTab(); }
    else if (form.id === "ctl-loan-filter") { const d = new FormData(form); state.ctl.loan = { search: String(d.get("search") || "").trim(), kind: d.get("kind"), status: d.get("status"), department: String(d.get("department") || "").trim(), fromDate: String(d.get("fromDate") || ""), toDate: String(d.get("toDate") || "") }; ctlRenderTab(); }
    else if (form.id === "ctl-bulk-form") await ctlBulkPreview(form);
    else if (form.id === "ctl-mgr-form") { if (await ctlSubmitManager(form)) { document.querySelector(".modal-backdrop:not(.ctl-confirm)").remove(); ctlRenderTab(); } }
    else if (form.id === "ctl-emp-form") { if (await ctlSubmitEmployee(form)) { document.querySelector(".modal-backdrop:not(.ctl-confirm)").remove(); ctlRenderTab(); } }
    else if (form.id === "ctl-loan-form") {
      const decision = event.submitter ? event.submitter.dataset.decision : "APPROVED";
      if (await ctlSubmitLoan(form, decision)) { document.querySelector(".modal-backdrop:not(.ctl-confirm)").remove(); ctlRenderTab(); }
    }
    else if (form.id === "ctl-export-form") {
      const d = Object.fromEntries(new FormData(form).entries());
      const button = form.querySelector("button[type=submit]"); button.disabled = true;
      try { const report = await rpc("apiDashExport", state.token, d); if (!report.rows.length) notify("لا توجد بيانات مطابقة."); else await ctlDownloadReport(report); } finally { button.disabled = false; }
    }
  } catch (error) { notify(error.message || "حدث خطأ."); }
}, true);

boot();
</script>
  </body>
</html>
